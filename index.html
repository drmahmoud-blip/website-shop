<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لبسني | متجر الأزياء</title>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body style="font-family: 'Cairo', sans-serif; background: #0f172a; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center;">
    <div>
        <h2 style="font-size: 24px; margin-bottom: 8px;">متجر لبسني</h2>
        <p style="color: #94a3b8; font-size: 14px;">جاري توجيهك إلى بوابة الدخول...</p>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const currentUser = ShopDB ? ShopDB.getCurrentUser() : null;
            if (currentUser) {
                if (currentUser.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'code_artifact (1).html';
                }
            } else {
                // If not authenticated, send to login authentication page
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
